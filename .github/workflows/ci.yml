name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate catalog, action client, and pet packages
        run: pnpm check

      - name: Test aggregate action endpoint
        run: pnpm counter:test

      - name: Build production site
        run: pnpm build

      - name: Validate built site output
        run: pnpm site:validate

      - name: Verify npm installer package
        run: npm pack --dry-run --cache "$RUNNER_TEMP/npm-cache"
